<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Общажня —技ническое обслуживание</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #18191c;
    --card: rgba(35, 36, 40, 0.85);
    --card-border: rgba(255, 255, 255, 0.08);
    --accent: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.35);
    --text: #f3f4f6;
    --muted: #8e9297;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Onest', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    max-width: 480px;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 40px 32px;
    text-align: center;
    backdrop-filter: blur(16px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .icon {
    font-size: 52px;
    margin-bottom: 20px;
    display: inline-block;
    animation: spin 3s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 14px;
  }

  p {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 8px;
  }

  .accent {
    color: var(--accent);
    font-weight: 600;
  }

  .dots span {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin: 0 3px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.4s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1.2); }
  }

  .dots {
    margin-top: 24px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">⚙️</div>
    <h1>Сайт временно недоступен</h1>
    <p>Мы проводим <span class="accent">крупное обновление</span>, чтобы сделать Общажню ещё лучше.</p>
    <p>Скоро вернёмся — спасибо за терпение!</p>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
</body>
</html>
